name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Uses the pnpm version from "packageManager" in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # Better Auth refuses its default secret in production builds. This
          # placeholder is only used to compile; deployments use AUTH_SECRET.
          BETTER_AUTH_SECRET: ci-build-placeholder-not-used-at-runtime
